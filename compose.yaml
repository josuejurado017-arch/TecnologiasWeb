# Despliegue con Docker: aplicacion (Apache + PHP) y MySQL.
# Las variables se leen del archivo .env de la raiz (mismo archivo que usa la
# aplicacion sin Docker). Ver seccion "Docker" del README.
services:
  web:
    build: .
    image: tecnologiasweb:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Vacio = enlaces relativos a la raiz; funciona con cualquier host o puerto.
      APP_URL: ${DOCKER_APP_URL:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-testdb}
      DB_USER: ${DB_USER:-biblioteca_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: ${TZ:-America/La_Paz}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-testdb}
      MYSQL_USER: ${DB_USER:-biblioteca_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en .env}
      TZ: ${TZ:-America/La_Paz}
    volumes:
      - db_data:/var/lib/mysql
      # Migraciones aplicadas solo la primera vez que se crea el volumen.
      # 007 (datos demo) se excluye a proposito; ver README para cargarlo.
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./db/003_permissions.sql:/docker-entrypoint-initdb.d/003_permissions.sql:ro
      - ./db/004_student_registration.sql:/docker-entrypoint-initdb.d/004_student_registration.sql:ro
      - ./db/005_student_catalog_permissions.sql:/docker-entrypoint-initdb.d/005_student_catalog_permissions.sql:ro
      - ./db/006_tutor_permissions.sql:/docker-entrypoint-initdb.d/006_tutor_permissions.sql:ro
      - ./db/008_tutorias_institucionales.sql:/docker-entrypoint-initdb.d/008_tutorias_institucionales.sql:ro
      - ./db/009_tutoria_slots_especiales.sql:/docker-entrypoint-initdb.d/009_tutoria_slots_especiales.sql:ro
      - ./db/010_rediseno_institucional.sql:/docker-entrypoint-initdb.d/010_rediseno_institucional.sql:ro
      - ./db/011_grupos_inscripciones.sql:/docker-entrypoint-initdb.d/011_grupos_inscripciones.sql:ro
      - ./db/012_asistencia_sesion.sql:/docker-entrypoint-initdb.d/012_asistencia_sesion.sql:ro
      - ./db/013_evaluacion_grupo.sql:/docker-entrypoint-initdb.d/013_evaluacion_grupo.sql:ro
      - ./db/014_historial_grupo.sql:/docker-entrypoint-initdb.d/014_historial_grupo.sql:ro
      - ./db/015_poda_modelo_viejo.sql:/docker-entrypoint-initdb.d/015_poda_modelo_viejo.sql:ro
      - ./db/016_drop_modelo_individual.sql:/docker-entrypoint-initdb.d/016_drop_modelo_individual.sql:ro
      - ./db/017_drop_matriz_permisos.sql:/docker-entrypoint-initdb.d/017_drop_matriz_permisos.sql:ro
      - ./db/018_unique_carrera_materia.sql:/docker-entrypoint-initdb.d/018_unique_carrera_materia.sql:ro
      - ./db/019_carnet_identidad.sql:/docker-entrypoint-initdb.d/019_carnet_identidad.sql:ro
      - ./db/020_tutor_materia_preferencias.sql:/docker-entrypoint-initdb.d/020_tutor_materia_preferencias.sql:ro
      - ./db/021_disponibilidad_intervenciones.sql:/docker-entrypoint-initdb.d/021_disponibilidad_intervenciones.sql:ro
      - ./db/022_tutor_materia_turno_dias.sql:/docker-entrypoint-initdb.d/022_tutor_materia_turno_dias.sql:ro
      - ./db/023_demanda_motivo.sql:/docker-entrypoint-initdb.d/023_demanda_motivo.sql:ro
      - ./db/024_grupo_dias.sql:/docker-entrypoint-initdb.d/024_grupo_dias.sql:ro
      - ./db/025_horarios_por_materia.sql:/docker-entrypoint-initdb.d/025_horarios_por_materia.sql:ro
      - ./db/026_tutor_materia_patron.sql:/docker-entrypoint-initdb.d/026_tutor_materia_patron.sql:ro
      - ./db/027_datos_operativos.sql:/docker-entrypoint-initdb.d/027_datos_operativos.sql:ro
      - ./db/028_aprobacion_tutores_grupos.sql:/docker-entrypoint-initdb.d/028_aprobacion_tutores_grupos.sql:ro
      # 029 migra los datos de 027 de aulas a espacios; en una base nueva 030 puede
      # borrar el catalogo legado de inmediato (no hay datos reales que comparar).
      - ./db/029_espacios_tutoria.sql:/docker-entrypoint-initdb.d/029_espacios_tutoria.sql:ro
      - ./db/030_drop_aulas_legado.sql:/docker-entrypoint-initdb.d/030_drop_aulas_legado.sql:ro
      - ./db/031_ciclo_periodos.sql:/docker-entrypoint-initdb.d/031_ciclo_periodos.sql:ro
      - ./db/032_ofertas_tutor_materia.sql:/docker-entrypoint-initdb.d/032_ofertas_tutor_materia.sql:ro
      - ./db/033_frecuencia_por_demanda.sql:/docker-entrypoint-initdb.d/033_frecuencia_por_demanda.sql:ro
      - ./db/034_oferta_sin_espacio.sql:/docker-entrypoint-initdb.d/034_oferta_sin_espacio.sql:ro
      - ./db/035_formacion_por_quorum.sql:/docker-entrypoint-initdb.d/035_formacion_por_quorum.sql:ro
      # 036 reemplaza los datos de 027 por otros generados con las reglas vigentes
      # (quorum para formar grupos, una tutoria por turno, frecuencia por demanda,
      # grupos aprobados con ubicacion).
      - ./db/036_datos_operativos.sql:/docker-entrypoint-initdb.d/036_datos_operativos.sql:ro
      # 037: una tutoria por estudiante, tope de grupos por tutor y periodos de un mes.
      - ./db/037_carga_por_periodo.sql:/docker-entrypoint-initdb.d/037_carga_por_periodo.sql:ro
      # 038 reemplaza los datos de 036 por otros generados con las reglas de 037 y el
      # calendario UPDS (Tutorias Julio 2026 cerrado, Tutorias Enero 2027 activo).
      - ./db/038_datos_operativos.sql:/docker-entrypoint-initdb.d/038_datos_operativos.sql:ro
      # 039: la coordinacion asigna tutor a una materia (el tutor acepta), cambia el
      # tutor de un grupo e inscribe o retira estudiantes a mano.
      - ./db/039_gestion_manual_grupos.sql:/docker-entrypoint-initdb.d/039_gestion_manual_grupos.sql:ro
      - ./db/040_ofertas_por_periodo.sql:/docker-entrypoint-initdb.d/040_ofertas_por_periodo.sql:ro
      # 041: el historial academico no se borra en cascada (FK RESTRICT) y la
      # demanda abierta de periodos cerrados pasa a vencida.
      - ./db/041_integridad_historial.sql:/docker-entrypoint-initdb.d/041_integridad_historial.sql:ro
      # 042: dividir un grupo lleno en dos grupos parejos (el tutor acepta).
      - ./db/042_division_grupos.sql:/docker-entrypoint-initdb.d/042_division_grupos.sql:ro
      # 043: tipos de tutoria (nombre libre); un periodo activo por tipo, en paralelo.
      - ./db/043_tipos_tutoria.sql:/docker-entrypoint-initdb.d/043_tipos_tutoria.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
