<VirtualHost *:80>
    # Vhost por defecto del contenedor: atiende cualquier nombre de host.
    ServerName tutorias.local
    ServerAlias www.tutorias.local

    DocumentRoot /var/www/html/TecnologiasWeb/php
    DirectoryIndex index.php

    Alias /Front/ /var/www/html/TecnologiasWeb/Front/
    Alias /usuarios/ /var/www/html/TecnologiasWeb/usuarios/
    Alias /css/ /var/www/html/TecnologiasWeb/css/
    Alias /js/ /var/www/html/TecnologiasWeb/js/

    <Directory /var/www/html/TecnologiasWeb>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/TecnologiasWeb/php>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/TecnologiasWeb/Front>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/TecnologiasWeb/usuarios>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/TecnologiasWeb/css>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/TecnologiasWeb/js>
        Options -Indexes
        Require all granted
    </Directory>

    # Rutas amigables del modelo institucional (deben coincidir con router.php).
    RewriteEngine On
    RewriteRule ^/?mis-tutorias/?$ /tutorias/mis.php [PT,L]
    RewriteRule ^/?mis-grupos/?$ /tutor/mis_grupos.php [PT,L]
    RewriteRule ^/?mis-evaluaciones/?$ /evaluaciones/mis.php [PT,L]
    RewriteRule ^/?mis-materias/?$ /tutor/mis_materias.php [PT,L]
    RewriteRule ^/?mi-perfil-tutor/?$ /tutor/mi_perfil.php [PT,L]
    RewriteRule ^/?cobertura-tutores/?$ /tutores/cobertura.php [PT,L]
    RewriteRule ^/?tutores/pendientes/?$ /tutores/pendientes.php [PT,L]
    # Antiguo modulo de aulas (db/029): redirige a Espacios de tutoria.
    RewriteRule ^/?aulas(/.*)?$ /espacios/desde_aulas.php [PT,L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
