; Ajustes de PHP para el contenedor de la aplicacion.
date.timezone = ${TZ}
expose_php = Off
display_errors = Off
log_errors = On
; El JIT de PCRE falla en algunos kernels/VM; misma decision que en install-ubuntu.sh.
pcre.jit = 0
; Documentos de solicitud de grado (foto o PDF, maximo 8 MB en la aplicacion).
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
